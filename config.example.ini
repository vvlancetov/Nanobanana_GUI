# Nanobanana GUI configuration.
# Copy this file to config.ini and fill in your provider details.

# Base URL of an OpenAI-compatible API (direct provider or proxy).
base_url=https://api.openai.com/v1

# API key sent as: Authorization: Bearer <key>
api_key=

# Generation path appended to base_url.
endpoint=/images/generations

# Comma-separated list shown in the model drop-down.
models=gpt-image-1,dall-e-3

# Currently selected model (updated by the app).
model=gpt-image-1

# auto | low | medium | high
quality=auto

# png | jpeg | webp
output_format=png

# Extra JSON object merged into the request body, e.g.
# {"aspect_ratio":"16:9","seed":42,"negative_prompt":"blur"}
extra_json=

# Output folder, relative to this file.
output_dir=Output

# Explicit image size in pixels, sent as size: "WxH".
width=1024
height=1024

# Number of images per request (1-10).
n=1

# Verify the server TLS certificate.
verify_tls=true

# HTTP request timeout in seconds.
timeout_sec=300

# Send response_format=b64_json (skipped for gpt-image* models).
send_response_format=true

# Transparent background checkbox state (updated by the app).
transparent=false
